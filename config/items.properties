# Cold Friend, Come In - item definitions.
# One block per item. The list below decides which items exist and the order they are shown in.
# To add an item: add its id to `items`, add an `item.<id>.*` block, and (optionally) a model key in
# assets/models/catalog.properties as `ITEM.<model key> = path[:scale]`. See docs/development/ITEM_SYSTEM.md.
#
# Keys per item:
#   name, description, category (MATERIAL, FOOD, CONTAINER, SUPPLY, TOOL), maxStack (1 = does not stack),
#   weight (kg per item, not enforced yet), model (a key, never a file name), icon (a key; blank = placeholder),
#   pickUp / drop / place (true or false; defaults true / true / false),
#   placeRadius (metres a placed item blocks; 0 = walk-through), useVerb (display only for now)

items=firewood, stone, branch, ration, water_container, bandage, matches

# What a new player starts with: id:quantity, ...
startingKit=firewood:4, stone:5, branch:6, ration:2, water_container:1, bandage:2, matches:1

item.firewood.name=Firewood
item.firewood.description=Split logs for the stove. They burn slowly and keep the cabin warm.
item.firewood.category=MATERIAL
item.firewood.maxStack=10
item.firewood.weight=1.5
item.firewood.model=firewood
item.firewood.icon=firewood
item.firewood.place=true
item.firewood.placeRadius=0.3

item.stone.name=Stone
item.stone.description=A smooth river stone. Heavy for its size.
item.stone.category=MATERIAL
item.stone.maxStack=20
item.stone.weight=0.8
item.stone.model=stone
item.stone.icon=stone
item.stone.place=true
item.stone.placeRadius=0.15

item.branch.name=Branch
item.branch.description=A dry branch. Good kindling.
item.branch.category=MATERIAL
item.branch.maxStack=20
item.branch.weight=0.3
item.branch.model=branch
item.branch.icon=branch
item.branch.place=true
item.branch.placeRadius=0.1

item.ration.name=Ration
item.ration.description=Dried food. Not tasty, but it keeps.
item.ration.category=FOOD
item.ration.maxStack=5
item.ration.weight=0.4
item.ration.model=ration
item.ration.icon=ration
item.ration.place=true
item.ration.placeRadius=0.15
item.ration.useVerb=Eat

item.water_container.name=Water Container
item.water_container.description=A sealed flask for carrying water from the river.
item.water_container.category=CONTAINER
item.water_container.maxStack=1
item.water_container.weight=1.0
item.water_container.model=water_container
item.water_container.icon=water_container
item.water_container.place=true
item.water_container.placeRadius=0.2
item.water_container.useVerb=Drink

item.bandage.name=Bandage
item.bandage.description=Clean cloth for dressing wounds.
item.bandage.category=SUPPLY
item.bandage.maxStack=10
item.bandage.weight=0.1
item.bandage.model=bandage
item.bandage.icon=bandage
item.bandage.place=false
item.bandage.useVerb=Use

item.matches.name=Matches
item.matches.description=A small box of matches. Keep them dry.
item.matches.category=SUPPLY
item.matches.maxStack=1
item.matches.weight=0.05
item.matches.model=matches
item.matches.icon=matches
item.matches.place=true
item.matches.placeRadius=0.1
