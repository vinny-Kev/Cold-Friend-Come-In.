# Cold Friend, Come In - tuning configuration.
# Read at start-up from config/game.properties relative to the working directory.
# Player-chosen settings are stored separately in config/settings.properties.

# New Game uses this seed when it is set (a number, or any text, which is hashed). Leave it blank for a random
# seed every time. The seed is always written to the log.
world.seed=

# Development only: where the player starts in a new world: cabin (default), village, river, stove, cabinview.
dev.spawn=
# Development only: the time of day a new game starts at: day (12:00), dusk (18:00), night (22:00) or HH:MM.
# Blank starts at 07:00 on day 1. The game clock and the light run on from there.
dev.time=
# Development only: a script to run after the world starts, for example inventory. Blank for none.
dev.scenario=
# Development only: set to anything (for example true) to show the frame rate.
dev.showFps=
# Development only: set to anything (for example true) to start a new world straight away.
dev.autostart=
# Development only: a file path (without .png). The game saves one picture of its own frame there after a few
# seconds and quits. Nothing outside the game window is captured.
dev.screenshot=

window.title=COLD FRIEND, COME IN.

# Defaults used when the player has no saved settings yet.
settings.default.masterVolume=80
settings.default.musicVolume=70
settings.default.sfxVolume=80
settings.default.resolution=1280x720
settings.default.fullscreen=false
settings.default.vsync=true
# Backdrop effects: off, light, normal or heavy. Normal uses the menu.* values below and the fog constants.
settings.default.fog=normal
settings.default.snow=normal
settings.default.cameraSway=true

# Main menu backdrop (placeholder procedural scene).
menu.treeCount=45
menu.snowParticleCount=500
menu.cameraDriftSpeed=0.15
menu.cameraDriftRadius=1.2
