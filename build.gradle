plugins {
    id 'java'
    id 'application'
}

group = 'com.coldfriend'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all,-this-escape' << '-Werror'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.jmonkeyengine:jme3-core:${jmeVersion}"
    implementation "org.jmonkeyengine:jme3-desktop:${jmeVersion}"
    implementation "org.jmonkeyengine:jme3-lwjgl3:${jmeVersion}"
    implementation "org.jmonkeyengine:jme3-effects:${jmeVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.coldfriend.Main'
}

// Developer tool: ./gradlew worldPreview -PpreviewArgs="--seed 7 --view river --night"
tasks.register('worldPreview', JavaExec) {
    group = 'application'
    description = 'Opens the terrain and water preview window.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.coldfriend.dev.WorldPreviewApp'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    if (project.hasProperty('previewArgs')) {
        args project.property('previewArgs').split(' ')
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
