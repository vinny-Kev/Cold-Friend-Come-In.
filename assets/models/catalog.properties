# Which model files draw each kind of scenery. Gameplay refers to kinds only (see PropKind), so models can be
# swapped here without touching code. Format: KIND = path[:scale], ... ; paths are relative to assets/.
# The optional scale is applied on top of each placement's own scale, to bring different packs to one size.
# KIND.tint = r, g, b (0 to 1) darkens or recolours a kind, for example to make autumn colours wintry.
# A kind with no usable entry falls back to simple procedural geometry.

